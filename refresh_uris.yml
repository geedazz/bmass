name: Refresh Gemini File URIs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  upload-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Upload PDFs to Gemini and save URIs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import os
          import time

          API_KEY = os.environ["GEMINI_API_KEY"]

          SOURCES = [
            ("https://raw.githubusercontent.com/geedazz/bmass/main/Biokuro%20tiekimo%20tipines%20salygos.pdf", "Biokuro tiekimo tipines salygos"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/Centralizuotos%20prekybos%20biokuru%20taisykles.pdf", "Centralizuotos prekybos biokuru taisykles"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/Energijos%20istekliu%20birzos%20reglamentas.pdf", "Energijos istekliu birzos reglamentas"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/Gamybos%20liekanu%20priskyrimo%20prie%20salutiniu%20produktu%20tvarkos%20aprasas.pdf", "Gamybos liekanu priskyrimo aprasas"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/Kietojo%20biokuro%20apskaitos%20taisykles.pdf", "Kietojo biokuro apskaitos taisykles"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/Kietojo%20biokuro%20kokybes%20reikalavimai.pdf", "Kietojo biokuro kokybes reikalavimai"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/Pirkimo-pardavimo-sutartis.pdf", "Pirkimo pardavimo sutartis"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/biokuro%20skiedros%20eminiu%20tyrimai.pdf", "Biokuro skiedros eminiu tyrimai"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/birzos-dalyvio-anketa.pdf", "Birzos dalyvio anketa"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/birzos-dalyvio-sutartis.pdf", "Birzos dalyvio sutartis"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/birzos-dalyviu-kategoriju-priskyrimo-ir-perziurejimo-taisykles.pdf", "Birzos dalyviu kategoriju taisykles"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/medienos%20kuro%20pelenu%20tvarkymo%20naudojimo%20taisykles.pdf", "Medienos kuro pelenu tvarkymo taisykles"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/prekybos-biokuro-produktais-salygos.pdf", "Prekybos biokuro produktais salygos"),
            ("https://raw.githubusercontent.com/geedazz/bmass/main/prekybos-biokuro-rezervo-produktais-taisykles.pdf", "Prekybos biokuro rezervo taisykles"),
          ]

          uris = []

          for url, name in SOURCES:
            print(f"Uploading: {name}")
            req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(req) as r:
              pdf_bytes = r.read()
            upload_url = f"https://generativelanguage.googleapis.com/upload/v1beta/files?key={API_KEY}"
            upload_req = urllib.request.Request(
              upload_url,
              data=pdf_bytes,
              method="POST",
              headers={
                "Content-Type": "application/pdf",
                "X-Goog-Upload-Command": "start, upload, finalize",
                "X-Goog-Upload-Header-Content-Length": str(len(pdf_bytes)),
                "X-Goog-Upload-Header-Content-Type": "application/pdf",
              }
            )
            with urllib.request.urlopen(upload_req) as r:
              data = json.loads(r.read())
            uri = data["file"]["uri"]
            uris.append({"name": name, "uri": uri})
            print(f"  OK: {uri}")
            time.sleep(0.5)

          with open("file_uris.json", "w", encoding="utf-8") as f:
            json.dump({"generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "uris": uris}, f, ensure_ascii=False, indent=2)

          print(f"Sekmingi ikelti {len(uris)} failai.")
          EOF

      - name: Commit and push file_uris.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add file_uris.json
          git diff --staged --quiet || git commit -m "chore: refresh Gemini file URIs [skip ci]"
          git push
